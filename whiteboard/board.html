// ---------- rng / roughen ----------
let seed=7; function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
function rough(pts,amp=1.7,step=16){
  const out=[]; const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28]; let s=0;
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1]; const L=Math.hypot(x2-x1,y2-y1); const n=Math.max(1,Math.round(L/step));
    const nx=-(y2-y1)/(L||1), ny=(x2-x1)/(L||1);
    for(let k=0;k<n;k++){const u=k/n; s+=L/n;
      const o=amp*(Math.sin(s/37+ph[0])*0.6+Math.sin(s/13+ph[1])*0.3+Math.sin(s/71+ph[2])*0.6);
      out.push([x1+(x2-x1)*u+nx*o, y1+(y2-y1)*u+ny*o]);}
  }
  out.push(pts[pts.length-1]); return out;
}
function toD(p){return 'M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L')}
// shapes -> point lists
const L=(x1,y1,x2,y2)=>[[x1,y1],[x2,y2]];
const rect=(x,y,w,h)=>[[x+w,y],[x,y],[x,y+h],[x+w,y+h],[x+w,y-6]];
function circ(cx,cy,r,a0=-1.9,ov=1.1,ry){ry=ry||r;const p=[];const n=56;for(let i=0;i<=n;i++){const a=a0-i/n*Math.PI*2*ov;const rr=1+0.03*Math.sin(i*0.4);p.push([cx+Math.cos(a)*r*rr,cy+Math.sin(a)*ry*rr])}return p}
function arc(cx,cy,r,a0,a1){const p=[];const n=30;for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function curve(pts,n=24){ // catmull-rom through pts
  const o=[];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
   for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;o.push([0,1].map(j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}
  o.push(pts[pts.length-1]);return o}
// ---------- timeline ----------
const scenes=[]; let cur=null; const ELS=[];
function scene(t0,t1){cur={t0,t1,g:null,els:[]};scenes.push(cur)}
function stroke(pts,t0,dur,o={}){const e={k:'p',pts:o.raw?pts:rough(pts,o.amp??1.7),t0,dur,c:o.c||INK,w:o.w||7,op:o.op||1,sc:cur,grp:o.grp};cur.els.push(e);ELS.push(e);return e}
function seq(list,t0,t1,o={}){ // list of pts arrays; split time by length
  const lens=list.map(p=>{let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return Math.max(s,30)});
  const tot=lens.reduce((a,b)=>a+b,0); const gap=Math.min(0.04,(t1-t0)*0.15/list.length); const avail=(t1-t0)-gap*(list.length-1);
  let t=t0; list.forEach((p,i)=>{const d=avail*lens[i]/tot; stroke(p,t,d,o); t+=d+gap});
}
function text(str,x,y,size,t0,t1,o={}){const e={k:'t',str,x,y,size,t0,dur:t1-t0,c:o.c||INK,font:o.font||'Lalezar',ltr:o.ltr,rot:o.rot||0,sc:cur,grp:o.grp};cur.els.push(e);ELS.push(e);return e}
function arrow(x1,y1,x2,y2,t0,t1,o={}){const a=Math.atan2(y2-y1,x2-x1),h=38;
  seq([curve([[x1,y1],[(x1+x2)/2,(y1+y2)/2-18],[x2,y2]]),[[x2+Math.cos(a+2.6)*h,y2+Math.sin(a+2.6)*h],[x2,y2],[x2+Math.cos(a-2.6)*h,y2+Math.sin(a-2.6)*h]]],t0,t1,o)}

  else seq(L2,t0,t1,o);
}

// ================= CAPTIONS =================
const CAPS=[[0.048,1.759,'إذا عندك مصدر دخل واحد بس،'],[2.003,2.601,'أنت مو آمن.'],[2.843,4.596,'أنت على بعد مشكلة وحدة من الأزمة.'],
[4.899,5.7,'موظف اجاني،'],[5.931,6.706,'راتبه ممتاز.'],[6.974,8.778,'بس الشركة قررت تقطع دوام إضافي.'],[9.073,9.796,'بشهر واحد،'],
[10.013,11.367,'دخله نزل 30%.'],[11.638,12.761,'ما كان عنده خطة بديلة.'],[12.943,14.018,'ولا مهارة معروضة.'],[14.173,15.416,'ولا عرض واحد جاهز.'],
[15.657,16.131,'قعدنا،'],[16.305,17.765,'وطلعنا مهارة وحدة من شغله.'],[18.047,19.654,'حولناها لمنتج رقمي صغير:'],[19.906,20.655,'دليل واحد.'],
[20.918,21.765,'بناه مرة وحدة،'],[21.949,23.085,'وصار يبيعه كل أسبوع.'],[23.375,24.515,'مو مبلغ كبير بالبداية،'],[24.724,25.891,'بس صار عنده مصدر ثاني.'],
[26.218,27.738,'إذا ما بدك تضل على راتب واحد،'],[27.968,29.66,'اكتب كلمة أمان بالتعليقات،'],[29.889,32.965,'وببعتلك كيف تحول مهارتك لمنتج رقمي صغير هالأسبوع.']];
const KEY=['آمن','الأزمة','30%','بديلة','معروضة','جاهز','رقمي','دليل','ثاني','أمان','هالأسبوع','ممتاز','إضافي'];
CAPS.forEach(c=>{const ws=c[2].split(' ');const tot=ws.reduce((a,w)=>a+w.length+2,0);let t=c[0];
  c.words=ws.map(w=>{const d=(c[1]-c[0])*(w.length+2)/tot;const o={w,t0:t,t1:t+d};t+=d;return o})});

// ================= BUILD DOM =================
const world=document.getElementById('world'), defs=document.getElementById('defs'), NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
let cid=0;
function build(){
  scenes.forEach((s,si)=>{s.g=mk('g',{},world);const grps={};
    s.els.forEach(e=>{let parent=s.g;if(e.grp){parent=grps[e.grp]||(grps[e.grp]=mk('g',{},s.g))}
      if(e.k==='p'){e.el=mk('path',{d:toD(e.pts),fill:'none',stroke:e.c,'stroke-width':e.w,'stroke-linecap':'round','stroke-linejoin':'round',opacity:e.op},parent);
        e.len=e.el.getTotalLength();e.el.style.strokeDasharray=e.len+' '+(e.len+10);}
      else{const id='c'+(cid++);const cp=mk('clipPath',{id},defs);e.clip=mk('rect',{x:0,y:-2000,width:0,height:6000},cp);
        const g=mk('g',{transform:`rotate(${e.rot} ${e.x} ${e.y})`},parent);
        e.el=mk('text',{x:e.x,y:e.y,'text-anchor':'middle','font-family':e.font,'font-size':e.size,fill:e.c,direction:e.ltr?'ltr':'rtl','clip-path':`url(#${id})`},g);
        e.el.textContent=e.str;const b=e.el.getBBox();e.bb={x:b.x-6,y:b.y,w:b.width+12,h:b.height};e.clip.setAttribute('x',e.bb.x);}
    });s.grps=grps;});
}
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function sceneT(s,t){ // returns {tx,s}
  const i=scenes.indexOf(s);const z=1+0.03*Math.min(1,Math.max(0,(t-s.t0)/(s.t1-s.t0)));
  let tx=0;const TR=0.3;
  if(i>0&&t<s.t0+TR)tx=-1150*(1-ease((t-s.t0)/TR));
  const nx=scenes[i+1];if(nx&&t>=nx.t0)tx=1150*ease((t-nx.t0)/TR);
  return {tx,z};
}
function scr(s,t,x,y){const T=sceneT(s,t);return [CX+(x-CX)*T.z+T.tx, CY+(y-CY)*T.z]}
function tipAt(e,p,t){ // tip point (scene coords) of element at progress p
  if(e.k==='p'){const q=e.el.getPointAtLength(e.len*p);return [q.x,q.y]}
  const b=e.bb;const x=e.ltr? b.x+b.w*p : b.x+b.w*(1-p);const y=b.y+b.h*0.55+b.h*0.18*Math.sin(p*b.w/22);
  const r=e.rot*Math.PI/180;const dx=x-e.x,dy=y-e.y;return [e.x+dx*Math.cos(r)-dy*Math.sin(r), e.y+dx*Math.sin(r)+dy*Math.cos(r)];
}
const REST=[1300,2250];
function handPos(t){
  const S=ELS.slice().sort((a,b)=>a.t0-b.t0);
  for(const e of S){if(t>=e.t0&&t<=e.t0+e.dur){const p=ease((t-e.t0)/e.dur*1.0);const pp=(t-e.t0)/e.dur;return scr(e.sc,t,...tipAt(e,e.k==='p'?pp:pp,t))}}
  let prev=null,next=null;for(const e of S){if(e.t0+e.dur<t)prev=e;else if(e.t0>t){next=e;break}}
  const pEnd=prev?scr(prev.sc,t,...tipAt(prev,1,t)):REST, pT=prev?prev.t0+prev.dur:-9;
  const nSt=next?scr(next.sc,t,...tipAt(next,0,t)):REST, nT=next?next.t0:99;
  const gap=nT-pT;
  if(prev&&next&&gap<0.9&&prev.sc===next.sc){const u=ease((t-pT)/gap);return [pEnd[0]+(nSt[0]-pEnd[0])*u,pEnd[1]+(nSt[1]-pEnd[1])*u-Math.sin(u*Math.PI)*30]}
  const OUT=0.4;
  if(prev&&t-pT<OUT){const u=ease((t-pT)/OUT);return [pEnd[0]+(REST[0]-pEnd[0])*u,pEnd[1]+(REST[1]-pEnd[1])*u]}
  if(next&&nT-t<OUT){const u=ease(1-(nT-t)/OUT);return [REST[0]+(nSt[0]-REST[0])*u,REST[1]+(nSt[1]-REST[1])*u]}
  return REST;
}
const capEl=document.getElementById('cap');let capIdx=-1;
function renderAt(t){
  scenes.forEach((s,i)=>{const nx=scenes[i+1];const vis=t>=s.t0-0.01&&(!nx||t<nx.t0+0.32);s.g.style.display=vis?'':'none';
    const T=sceneT(s,t);s.g.setAttribute('transform',`translate(${T.tx},0) translate(${CX},${CY}) scale(${T.z}) translate(${-CX},${-CY})`);
    s.els.forEach(e=>{const p=Math.min(1,Math.max(0,(t-e.t0)/e.dur));
      if(e.k==='p')e.el.style.strokeDashoffset=e.len*(1-p);
      else {const w=e.bb.w*p; e.clip.setAttribute('width',w); e.clip.setAttribute('x',e.ltr?e.bb.x:e.bb.x+e.bb.w-w);}});
    // pillar tilt in scene 1
    if(i===0&&s.grps.p1){const a=-7*ease((t-3.28)/0.5);s.grps.p1.setAttribute('transform',`rotate(${a} 540 1130)`)}
  });
  const hp=handPos(t);const h=document.getElementById('hand');h.style.display='';const rot=2.5*Math.sin(t*1.7);h.setAttribute('transform',`translate(${hp[0].toFixed(1)},${hp[1].toFixed(1)}) rotate(${rot.toFixed(2)}) scale(0.46) translate(-40,-560)`);
  // captions
  let ci=-1;CAPS.forEach((c,i)=>{if(t>=c[0]-0.05)ci=i});
  if(ci>=0&&CAPS[ci+1]===undefined&&t>CAPS[ci][1]+1.5)ci=-1;
  if(ci!==capIdx){capIdx=ci;capEl.innerHTML='';if(ci>=0)CAPS[ci].words.forEach(o=>{const sp=document.createElement('span');sp.textContent=o.w;o.el=sp;capEl.appendChild(sp)})}
  if(ci>=0)CAPS[ci].words.forEach(o=>{const st=t>=o.t0?(t<o.t1?2:1):0;const key=KEY.some(k=>o.w.includes(k));
    const ap=Math.min(1,Math.max(0,(t-o.t0+0.06)/0.12));
    o.el.style.opacity=st===0?0:ap; o.el.style.color=(st===2||key)?OR:INK;
    o.el.style.transform=`translateY(${(1-ap)*14}px) scale(${st===2?1.07:1})`;});
}
window.TIMELINE=()=>ELS.map(e=>({k:e.k,t0:e.t0,dur:e.dur}));
window.ready=Promise.all([document.fonts.load('96px Lalezar','مصدر'),document.fonts.load('800 60px Cairo','مصدر')]).then(()=>document.fonts.ready).then(()=>{build();renderAt(0);return true});
window.renderAt=renderAt;
</script></body></html>
